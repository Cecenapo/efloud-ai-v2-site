name: EFLOUD V2 — Hourly market snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect_live.py"
      - "scripts/paper_forward.py"
      - "scripts/research_engine.py"
      - "scripts/test_*.py"
      - ".github/workflows/hourly-prices.yml"
  schedule:
    - cron: "13 * * * *"
permissions:
  contents: write
concurrency:
  group: efloud-v2-market-snapshot
  cancel-in-progress: false
jobs:
  publish_quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check collector tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
        env:
          PYTHONPATH: scripts
      - name: Snapshot public read-only prices
        run: python scripts/collect_live.py
      - name: Observe new completed-bar shadow setups and settle prior signals
        run: python scripts/paper_forward.py
      - name: Publish only changed aggregate JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          if test -f learning_state.json; then git add learning_state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh read-only hourly market snapshot [skip ci]"
            git pull --rebase origin main
            git push
          fi
