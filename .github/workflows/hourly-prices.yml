name: EFLOUD V2 — Hourly market snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect_live.py"
      - "scripts/paper_forward.py"
      - "scripts/experimental_lab.py"
      - "scripts/redk_features.py"
      - "scripts/redk_ablation.py"
      - "scripts/research_engine.py"
      - "scripts/test_*.py"
      - ".github/workflows/hourly-prices.yml"
  schedule:
    - cron: "13 * * * *"
permissions:
  contents: write
concurrency:
  group: efloud-v2-market-snapshot
  cancel-in-progress: false
jobs:
  publish_quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RedK indicator math dependencies (open source)
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3"
      - name: Check collector tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
        env:
          PYTHONPATH: scripts
      - name: Snapshot public read-only prices
        run: python scripts/collect_live.py
      - name: Independent experimental radar - observation only (no fills or orders)
        run: python scripts/experimental_lab.py radar
      - name: Keep verified educator-source auto-signal gate disabled
        run: python scripts/paper_forward.py
      - name: Publish JSON atomically with retries after concurrent hourly/daily pushes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/efloud-generated
          for f in live.json learning_state.json experimental_radar.json; do
            if test -f "$f"; then cp "$f" /tmp/efloud-generated/; fi
          done
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp -f /tmp/efloud-generated/* ./
            git add -f live.json learning_state.json experimental_radar.json
            if git diff --cached --quiet; then
              echo "No new JSON payload"
              exit 0
            fi
            git commit -m "data: publish fresh independent evidence after concurrent workflow [skip ci]"
            if git push origin HEAD:main; then
              echo "Published payload on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Could not publish after five attempts" >&2
          exit 1
