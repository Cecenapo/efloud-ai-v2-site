name: EFLOUD V2 — Daily historical research and learning
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/source_policy.py"
      - "scripts/source_range.py"
      - "scripts/research_engine.py"
      - "scripts/experimental_lab.py"
      - "scripts/redk_features.py"
      - "scripts/redk_ablation.py"
      - "scripts/test_*.py"
      - ".github/workflows/daily-research.yml"
  schedule:
    - cron: "23 2 * * *"
permissions:
  contents: write
concurrency:
  group: efloud-v2-daily-research
  cancel-in-progress: false
jobs:
  historical_research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RESEARCH_MAX_BARS: "3000"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RedK indicator math dependencies (open source)
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3"
      - name: Test data integrity and source-verification gate
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Check real CLOSED Binance Spot candle availability only
        id: run_research
        continue-on-error: true
        run: python scripts/research_engine.py
      - name: Independent experimental backtest with out-of-sample reporting
        id: experimental
        continue-on-error: true
        env:
          LAB_MAX_BARS: "3000"
        run: python scripts/experimental_lab.py daily
      - name: Publish JSON atomically with retries after concurrent hourly/daily pushes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/efloud-generated
          for f in model_results.json pipeline_status.json experimental_lab.json experimental_redk_summary.json; do
            if test -f "$f"; then cp "$f" /tmp/efloud-generated/; fi
          done
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp -f /tmp/efloud-generated/* ./
            git add -f model_results.json pipeline_status.json experimental_lab.json experimental_redk_summary.json
            if git diff --cached --quiet; then
              echo "No new JSON payload"
              exit 0
            fi
            git commit -m "data: publish fresh independent evidence after concurrent workflow [skip ci]"
            if git push origin HEAD:main; then
              echo "Published payload on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Could not publish after five attempts" >&2
          exit 1
      - name: Fail on unusable market data response
        if: steps.run_research.outcome != 'success' || steps.experimental.outcome != 'success'
        run: exit 1
