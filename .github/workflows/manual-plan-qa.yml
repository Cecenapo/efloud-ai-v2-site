name: EFLOUD Manual Structure QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalogue-context.js'
      - 'catalogue-context-ui.js'
      - 'scripts/test_catalogue_context.cjs'
      - 'manual-plan-math.js'
      - 'efloud-cycle-engine.js'
      - 'efloud-cycle-ui.js'
      - 'efloud-cycle.css'
      - 'scripts/test_efloud_cycle.cjs'
      - 'manual-plan-ui.js'
      - 'manual-plan.css'
      - 'setup-chart.js'
      - 'instructor_rules.json'
      - 'instructor-rules-ui.js'
      - 'index.html'
      - 'scripts/test_manual_plan.cjs'
      - 'scripts/test_instructor_atlas.py'
      - '.github/workflows/manual-plan-qa.yml'
permissions:
  contents: read
concurrency:
  group: efloud-manual-plan-qa
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate JavaScript syntax
        run: |
          node --check catalogue-context.js
          node --check catalogue-context-ui.js
          node --check manual-plan-math.js
          node --check efloud-cycle-engine.js
          node --check efloud-cycle-ui.js
          node --check manual-plan-ui.js
          node --check setup-chart.js
          node --check instructor-rules-ui.js
      - name: Run structural analysis and no-trade tests
        run: node --test scripts/test_manual_plan.cjs scripts/test_catalogue_context.cjs scripts/test_efloud_cycle.cjs
      - name: Reconcile note archive and original source
        run: python -m unittest discover -s scripts -p 'test_instructor_atlas.py' -v
